name: 🔍 Napi Pokémon Monitor

on:
  schedule:
    - cron: '0 7 * * *'   # Minden nap 7:00 UTC (9:00 Budapest)
  workflow_dispatch:        # Kézi indítás lehetősége

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Kód letöltése
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Függőségek telepítése
        run: pip install -r requirements.txt

      - name: 🚀 Monitor futtatása
        run: python main.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: 📊 Log mentése artifact-ként
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log-${{ github.run_number }}
          path: '*.log'
          retention-days: 7
